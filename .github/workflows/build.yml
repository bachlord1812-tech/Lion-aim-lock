name: Build Android .so

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r26c" >> $GITHUB_ENV

      - name: Build with ndk-build
        run: |
          mkdir -p libs
          $ANDROID_NDK/ndk-build
        env:
          NDK_PROJECT_PATH: ${{ github.workspace }}

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libLionAimLock
          path: libs/arm64-v8a/libLionAimLock.so
